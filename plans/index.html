    <script>
      (() => {
        const schemePrefetchItems = [
          {
            href: "/cases/scheme-001/",
            image: "/assets/optimized/schemes-detail/layout-study/cinema/layout-study-03-cinema.webp"
          },
          {
            href: "/cases/scheme-002/",
            image: "/assets/optimized/schemes-detail/function-rework/cinema/function-rework-01-cinema.webp"
          },
          {
            href: "/cases/scheme-003/",
            image: "/assets/optimized/schemes-detail/circulation-plan/cinema/circulation-plan-01-cinema.webp"
          }
        ];

        function prefetchResource(href, as) {
          if (!href || document.querySelector(`link[rel="prefetch"][href="${href}"]`)) return;
          const link = document.createElement("link");
          link.rel = "prefetch";
          link.href = href;
          if (as) link.as = as;
          link.fetchPriority = "low";
          document.head.appendChild(link);
        }

        function prefetchScheme(item) {
          if (!item) return;
          prefetchResource(item.href, "document");
          prefetchResource(item.image, "image");
          prefetchResource("/assets/css/scheme-detail.css?v=20260621-nav-unified", "style");
          prefetchResource("/assets/js/scheme-detail.js?v=20260621-scheme-direct-mobile", "script");
        }

        const canBackgroundPrefetch = () =>
          window.matchMedia("(min-width: 861px) and (hover: hover) and (pointer: fine)").matches;

        function schedulePrefetch() {
          if (!canBackgroundPrefetch()) return;
          const run = () => {
            prefetchScheme(schemePrefetchItems[0]);
            window.setTimeout(() => prefetchScheme(schemePrefetchItems[1]), 1600);
            window.setTimeout(() => prefetchScheme(schemePrefetchItems[2]), 3000);
          };
          window.setTimeout(() => {
            if ("requestIdleCallback" in window) {
              window.requestIdleCallback(run, { timeout: 2200 });
              return;
            }
            run();
          }, 1200);
        }

        schemePrefetchItems.forEach((item) => {
          const card = document.querySelector(`a[href="${item.href}"]`);
          card?.addEventListener("mouseenter", () => {
            if (canBackgroundPrefetch()) prefetchScheme(item);
          });
        });
        schedulePrefetch();
      })();
    </script>
