          <h1>澄境公寓</h1>
          <p class="lead">浅色材质、弧形门洞与连续柜体，让小尺度公寓保持开阔和安静。设计把采光、收纳、餐厨关系和日常动线放在同一条线索里，让家看起来清爽，也真正好住。</p>

      <section class="copy-row">
        <h2>清透、柔和、可长期居住</h2>
        <p>公寓空间最怕被功能切碎。澄境公寓用浅色墙面和连续柜体先统一空间背景，再用弧形门洞、石材肌理和低照度灯光补充细节。收纳被放进立面，视线被留给光线和家具比例，日常生活因此显得更轻、更安静。</p>
