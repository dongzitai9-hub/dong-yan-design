line="middle" letter-spacing="0">降下去</text><path d="M1040 1225V1340" stroke="#423f38" stroke-width="14" stroke-linecap="round"></path><path d="M992 1298L1040 1368L1088 1298Z" fill="#423f38"></path><line x1="760" y1="1410" x2="1180" y2="1410" stroke="#423f38" stroke-width="6" stroke-dasharray="28 20"></line><rect x="930" y="1535" width="180" height="82" fill="#f4dfa4" rx="18"></rect><text x="1020" y="1577" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="62" font-weight="750" fill="#2d2a24" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">H4</text><path d="M1020 1520V1415" stroke="#423f38" stroke-width="7"></path><text x="750" y="105" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="62" font-weight="700" fill="#536d57" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">灶台高度可单独推敲</text><text x="750" y="1660" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="38" font-weight="500" fill="#2d2a24" text-anchor="middle" dominant-baseline="hanging" letter-spacing="0">中式炒锅把手更高，锅也更重</text><text x="750" y="1713.96" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="38" font-weight="500" fill="#2d2a24" text-anchor="middle" dominant-baseline="hanging" letter-spacing="0">条件允许时，灶台可比操作台低约 80mm</text>
