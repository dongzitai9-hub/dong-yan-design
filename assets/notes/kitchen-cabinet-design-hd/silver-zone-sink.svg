<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title">
  <title id="title">水槽旁银二区尺寸</title>
  <defs>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c7a978"/>
      <stop offset=".55" stop-color="#a97c4f"/>
      <stop offset="1" stop-color="#7a5737"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f1f2ef"/>
      <stop offset=".45" stop-color="#9fa4a2"/>
      <stop offset="1" stop-color="#666c6a"/>
    </linearGradient>
    <linearGradient id="paperWarm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f2ece0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff3c3"/>
      <stop offset=".5" stop-color="#d3a64b"/>
      <stop offset="1" stop-color="#8d6a28"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f5f2"/>
      <stop offset=".55" stop-color="#c7cbc9"/>
      <stop offset="1" stop-color="#7d8582"/>
    </linearGradient>
    <pattern id="tile" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="#d8d6cf"/>
      <path d="M150 0H0V150" fill="none" stroke="#bdbbb4" stroke-width="2"/>
    </pattern>
    <pattern id="stone" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#f1eee7"/>
      <circle cx="22" cy="34" r="2.4" fill="#cbc1b0" opacity=".55"/>
      <circle cx="76" cy="18" r="1.8" fill="#b7ae9f" opacity=".45"/>
      <circle cx="104" cy="78" r="2.2" fill="#d2c6b5" opacity=".55"/>
      <circle cx="42" cy="96" r="1.8" fill="#b8b1a7" opacity=".4"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2d2a24" flood-opacity=".16"/>
    </filter>
    
  </defs>
  <rect width="1200" height="1500" fill="#fbfaf6"/>
  <rect x="0" y="0" width="1200" height="1500" fill="#fbfaf6"></rect><text x="600" y="120" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="70" font-weight="750" fill="#2d2a24" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">银二区</text><text x="600" y="210" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="34" font-weight="480" fill="#6a665e" text-anchor="middle" dominant-baseline="hanging" letter-spacing="0">水槽到墙边的空间。</text><text x="600" y="258.28" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="34" font-weight="480" fill="#6a665e" text-anchor="middle" dominant-baseline="hanging" letter-spacing="0">留出位置，就能放沥水架。</text><rect x="80" y="405" width="1040" height="620" fill="url(#stone)" stroke="#b8b0a4" stroke-width="5" rx="12"></rect><rect x="130" y="455" width="510" height="360" fill="#d9dad5" stroke="#7d817e" stroke-width="4" rx="12"></rect><rect x="152" y="479" width="466" height="312" fill="url(#steel)" stroke="#6f7471" stroke-width="5" rx="18"></rect><circle cx="374.79999999999995" cy="642.2" r="22" fill="#6b706d" stroke="#e5e5e0" stroke-width="5"></circle><circle cx="374.79999999999995" cy="642.2" r="10" fill="#262723"></circle><path d="M395.2 477C425.79999999999995 407,476.8 407,481.9 481" fill="none" stroke="url(#steel)" stroke-width="12" stroke-linecap="round"></path><rect x="476.8" y="515" width="14" height="58" fill="url(#steel)" rx="7"></rect><rect x="690" y="340" width="300" height="570" fill="#ece2c2" stroke="#e0cd80" stroke-width="4" rx="8"></rect><rect x="720" y="385" width="240" height="440" fill="#b7b9b2" stroke="#6f7471" stroke-width="5" rx="12"></rect><line x1="748" y1="410" x2="748" y2="795" stroke="#70756f" stroke-width="6"></line><line x1="782" y1="410" x2="782" y2="795" stroke="#70756f" stroke-width="6"></line><line x1="816" y1="410" x2="816" y2="795" stroke="#70756f" stroke-width="6"></line><line x1="850" y1="410" x2="850" y2="795" stroke="#70756f" stroke-width="6"></line><line x1="884" y1="410" x2="884" y2="795" stroke="#70756f" stroke-width="6"></line><line x1="918" y1="410" x2="918" y2="795" stroke="#70756f" stroke-width="6"></line><line x1="952" y1="410" x2="952" y2="795" stroke="#70756f" stroke-width="6"></line><ellipse cx="768" cy="610" rx="27" ry="125" fill="#f7f5ef" stroke="#cfc9ba" stroke-width="3"></ellipse><ellipse cx="816" cy="610" rx="27" ry="125" fill="#f7f5ef" stroke="#cfc9ba" stroke-width="3"></ellipse><ellipse cx="864" cy="610" rx="27" ry="125" fill="#f7f5ef" stroke="#cfc9ba" stroke-width="3"></ellipse><ellipse cx="912" cy="610" rx="27" ry="125" fill="#f7f5ef" stroke="#cfc9ba" stroke-width="3"></ellipse><line x1="260" y1="1120" x2="930" y2="1120" stroke="#bca247" stroke-width="5"></line><line x1="260" y1="1098" x2="260" y2="1142" stroke="#bca247" stroke-width="5"></line><line x1="930" y1="1098" x2="930" y2="1142" stroke="#bca247" stroke-width="5"></line><text x="595" y="1178" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="52" font-weight="650" fill="#bca247" text-anchor="middle" dominant-baseline="middle" letter-spacing="0">≥300mm</text><line x1="260" y1="410" x2="260" y2="1165" stroke="#bca247" stroke-width="4" stroke-dasharray="14 14"></line><line x1="930" y1="410" x2="930" y2="1165" stroke="#bca247" stroke-width="4" stroke-dasharray="14 14"></line>
</svg>
