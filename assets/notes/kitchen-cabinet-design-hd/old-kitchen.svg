<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350" role="img" aria-labelledby="title">
  <title id="title">旧时厨房生活场景图</title>
  <defs>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c7a978"/>
      <stop offset=".55" stop-color="#a97c4f"/>
      <stop offset="1" stop-color="#7a5737"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f1f2ef"/>
      <stop offset=".45" stop-color="#9fa4a2"/>
      <stop offset="1" stop-color="#666c6a"/>
    </linearGradient>
    <linearGradient id="paperWarm" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f2ece0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff3c3"/>
      <stop offset=".5" stop-color="#d3a64b"/>
      <stop offset="1" stop-color="#8d6a28"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f4f5f2"/>
      <stop offset=".55" stop-color="#c7cbc9"/>
      <stop offset="1" stop-color="#7d8582"/>
    </linearGradient>
    <pattern id="tile" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="#d8d6cf"/>
      <path d="M150 0H0V150" fill="none" stroke="#bdbbb4" stroke-width="2"/>
    </pattern>
    <pattern id="stone" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#f1eee7"/>
      <circle cx="22" cy="34" r="2.4" fill="#cbc1b0" opacity=".55"/>
      <circle cx="76" cy="18" r="1.8" fill="#b7ae9f" opacity=".45"/>
      <circle cx="104" cy="78" r="2.2" fill="#d2c6b5" opacity=".55"/>
      <circle cx="42" cy="96" r="1.8" fill="#b8b1a7" opacity=".4"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#2d2a24" flood-opacity=".16"/>
    </filter>
    
  </defs>
  <rect width="2400" height="1350" fill="#fbfaf6"/>
