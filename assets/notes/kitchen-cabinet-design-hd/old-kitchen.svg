"#8e8372" stroke-width="4" rx="8"></rect><text x="1200" y="160" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="42" font-weight="520" fill="#536d57" text-anchor="middle" dominant-baseline="hanging" letter-spacing="0">一只煤炉、一把火钳、一只木碗橱</text><text x="1200" y="219.64" font-family="&quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, sans-serif" font-size="42" font-weight="520" fill="#536d57" text-anchor="middle" dominant-baseline="hanging" letter-spacing="0">厨房还没有形成系统，收纳和动线主要靠经验维持</text>
