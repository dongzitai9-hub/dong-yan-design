server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _ 47.103.223.113;
    root /var/www/dongyandesign;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache, must-revalidate";

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location ~* \.(?:css|js|mjs|json|xml|jpg|jpeg|png|webp|gif|svg|ico|woff2?|ttf|mp4)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name dongyandesign.cn;
    root /var/www/dongyandesign;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://dongyandesign.cn$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name www.dongyandesign.cn;
    root /var/www/dongyandesign;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://dongyandesign.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name dongyandesign.cn;
    root /var/www/dongyandesign;
    index index.html;

    add_header Cache-Control "no-cache, must-revalidate";

    ssl_certificate /etc/letsencrypt/live/dongyandesign.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dongyandesign.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=600";
        try_files /sitemap.xml =404;
    }

    location = /cases/space-013/ {
        return 301 https://dongyandesign.cn/cases/;
    }

    location = /cases/space-013 {
        return 301 https://dongyandesign.cn/cases/;
    }

    location = /cases/space-001/ {
        return 301 https://dongyandesign.cn/cases/;
    }

    location = /cases/space-001 {
        return 301 https://dongyandesign.cn/cases/;
    }

    location = /cases/space-002/ {
        return 301 https://dongyandesign.cn/cases/;
    }

    location = /cases/space-002 {
        return 301 https://dongyandesign.cn/cases/;
    }

    location = /api/consultation {
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|mjs|json|xml|jpg|jpeg|png|webp|gif|svg|ico|woff2?|ttf|mp4)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.dongyandesign.cn;

    ssl_certificate /etc/letsencrypt/live/dongyandesign.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dongyandesign.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://dongyandesign.cn$request_uri;
}
